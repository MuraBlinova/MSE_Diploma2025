<!DOCTYPE html>
<html lang="en">	
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>        
		<title>A trip under the moonlight</title>
		<style type="text/css">
			body {
				margin: 0px;
				overflow: hidden;
			}
			
			#env-selector {
				position: absolute;
				left: 5px;
				top: 10px;
				z-index: 1;
			}
			
			#env-selector, #env-selector ul {
				padding: 0px;
				margin: 0px;
			}
      
			#env-selector ul li {
				display: inline;
        padding: 0px;
        margin:0px;      
      }
			
			#env-selector ul li a {
				display: inline;
        text-decoration: none;
				background-color: #000;
				color: #fff;
				opacity: 0.6;
				padding: 5px;
				font-family: Arial;
				font-size: medium;
				cursor: pointer;
				margin-right: 5px;
				transition: all 1s;
			}
			
			#env-selector ul li a:hover {
				background-color: #fff;
				color: #000;
			}
			
			#env-selector ul li.selected a {
				background-color: #3333cc;
				color: #fff;
			}
		</style>     
    <!-- <link href="js/libs/messg.css" rel="stylesheet"> -->
	</head>
	<body>

		<!-- <script src="js/libs/stats.min.js"></script> -->
		<script src="js/libs/three.min.js"></script>		
		<script src="js/libs/dat.gui.min.js"></script>
		<script src="js/libs/jquery-2.1.4.min.js"></script>
		<!-- <script src="js/libs/messg.min.js"></script> -->
		<script src="js/controls/OrbitControls.js"></script>
		<script src="js/shaders/ScreenSpaceShader.js"></script>
		<script src="js/shaders/FFTOceanShader.js"></script>
		<script src="js/shaders/OceanShader.js"></script>
		<script src="js/effects/MirrorRenderer.js"></script>
		<script src="js/shaders/CloudShader2.js"></script>
		<script src="js/shaders/RainShader.js"></script>
		<script src="js/loaders/OBJMTLLoader.js"></script>
		<script src="js/loaders/MTLLoader.js"></script>
		<script src="js/effects/Ocean.js"></script>		
		<script src="js/demo.js"></script>

		<script>
			var lastTime = ( new Date() ).getTime();

			var WINDOW = {
				ms_Width : 0,
				ms_Height : 0,
				ms_Callbacks : {
					70: "WINDOW.ToggleFullScreen()", // Toggle fullscreen
				},

				Initialize : function () {
					this.UpdateSize();

					// Create callbacks from keyboard
					document.onkeydown = function ( inEvent ) { WINDOW.CallAction( inEvent.keyCode ); };
					window.onresize = function ( inEvent ) {
						WINDOW.UpdateSize();
						WINDOW.ResizeCallback( WINDOW.ms_Width, WINDOW.ms_Height );
					};
				},
				
				UpdateSize : function () {
					this.ms_Width = window.innerWidth ;
					this.ms_Height = window.innerHeight;
				},
				
				CallAction : function ( inId ) {
					if ( inId in this.ms_Callbacks ) {
						eval( this.ms_Callbacks[inId] );
						return false;
					}
				},
				
				ToggleFullScreen : function () {
					if ( !document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement ) {
						if ( document.documentElement.requestFullscreen ) {
							document.documentElement.requestFullscreen();
						}
						else if ( document.documentElement.mozRequestFullScreen ) {
							document.documentElement.mozRequestFullScreen();
						}
						else if (document.documentElement.webkitRequestFullscreen) {
							document.documentElement.webkitRequestFullscreen( Element.ALLOW_KEYBOARD_INPUT );
						}
					}
					else {
						if ( document.cancelFullScreen ) {
							document.cancelFullScreen();
						}
						else if ( document.mozCancelFullScreen ) {
							document.mozCancelFullScreen();
						}
						else if ( document.webkitCancelFullScreen ) {
							document.webkitCancelFullScreen();
						}
					}
				},
				ResizeCallback : function ( inWidth, inHeight ) { },
			};

			WINDOW.Initialize();
			
			DEMO.Initialize();


			var gpuTimerDiv = document.createElement('div');
			gpuTimerDiv.style.position = 'absolute';
			gpuTimerDiv.style.left = '10px';
			gpuTimerDiv.style.top = '10px';
			gpuTimerDiv.style.background = 'rgba(0,0,0,0.7)';
			gpuTimerDiv.style.color = '#0f0';
			gpuTimerDiv.style.fontFamily = 'monospace';
			gpuTimerDiv.style.fontSize = '18px';
			gpuTimerDiv.style.padding = '6px 12px';
			gpuTimerDiv.style.zIndex = 1000;
			gpuTimerDiv.innerText = 'GPU: -- ms';
			document.body.appendChild(gpuTimerDiv);

			WINDOW.ResizeCallback = function ( inWidth, inHeight ) { DEMO.Resize( inWidth, inHeight ); };
			DEMO.Resize( WINDOW.ms_Width, WINDOW.ms_Height );


			// WebGL GPU Timer (EXT_disjoint_timer_query)
			var gl = DEMO.ms_Renderer.getContext();
			var ext = gl.getExtension('EXT_disjoint_timer_query');
			var timerQuery = null;
			var gpuTime = 0;
			var pending = false;

			function render() {
				if (ext && !pending) {
					timerQuery = ext.createQueryEXT();
					ext.beginQueryEXT(ext.TIME_ELAPSED_EXT, timerQuery);
				}

				requestAnimationFrame(render);
				DEMO.Update();

				if (ext && timerQuery) {
					ext.endQueryEXT(ext.TIME_ELAPSED_EXT);
					pending = true;
				}

				if (ext && pending) {
					var available = ext.getQueryObjectEXT(timerQuery, ext.QUERY_RESULT_AVAILABLE_EXT);
					var disjoint = gl.getParameter(ext.GPU_DISJOINT_EXT);
					if (available && !disjoint) {
						gpuTime = ext.getQueryObjectEXT(timerQuery, ext.QUERY_RESULT_EXT) / 1e6; // ns -> ms
						// gpuTimerDiv.innerText = 'GPU: ' + gpuTime.toFixed(2) + ' ms (time per frame)';
						gpuTimerDiv.innerText = 'GPU: ' + gpuTime.toFixed(2) + ' ms\n FPS: ' + (1000 / gpuTime).toFixed(1);
						ext.deleteQueryEXT(timerQuery);
						timerQuery = null;
						pending = false;
					}
				}
			}

			render();

		</script>
	</body>
</html>
